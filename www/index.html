<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="Aplicación de finanzas personales con ingresos, egresos y cuotas">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
  <title>Cuaderno de Gastos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>📒 Cuaderno de Gastos</h1>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">Resumen</button>
      <button class="tab" data-tab="add">Agregar</button>
      <button class="tab" data-tab="subscriptions">Suscripciones</button>
      <button class="tab" data-tab="nextmonth">Próximo Mes</button>
      <button class="tab" data-tab="history">Historial</button>
      <button class="tab" data-tab="installments">Cuotas</button>
    </nav>

    <!-- DASHBOARD -->
    <section id="dashboard" class="tab-content active">
      <div class="summary-cards">
        <div class="card income">
          <h3>Ingresos</h3>
          <p id="total-income">$0</p>
        </div>
        <div class="card expense">
          <h3>Egresos</h3>
          <p id="total-expense">$0</p>
        </div>
        <div class="card balance">
          <h3>Balance</h3>
          <p id="total-balance">$0</p>
        </div>
      </div>

      <h2>Este mes</h2>
      <div id="monthly-summary" class="monthly-box">
        <p>No hay datos este mes</p>
      </div>

      <h2>Próximas cuotas</h2>
      <div id="upcoming-installments" class="monthly-box">
        <p>No hay cuotas pendientes</p>
      </div>
    </section>

    <!-- ADD -->
    <section id="add" class="tab-content">
      <h2>Agregar movimiento</h2>
      <form id="form-add">
        <label>Descripción</label>
        <input type="text" id="input-desc" placeholder="Ej: Compra silla gamer" required>

        <label>Monto</label>
        <input type="number" id="input-amount" placeholder="0" min="0" step="0.01" required>

        <label>Tipo</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="type" value="income" required> Ingreso
          </label>
          <label class="radio-label">
            <input type="radio" name="type" value="expense" required> Egreso
          </label>
        </div>

        <label>Categoría</label>
        <select id="input-category">
          <option value="general">General</option>
          <option value="alimentacion">Alimentación</option>
          <option value="transporte">Transporte</option>
          <option value="entretenimiento">Entretenimiento</option>
          <option value="servicios">Servicios</option>
          <option value="salud">Salud</option>
          <option value="educacion">Educación</option>
          <option value="trabajo">Trabajo</option>
          <option value="otro">Otro</option>
        </select>

        <label>¿Cómo lo pagaste?</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="paymentMethod" value="debit" required> Débito
          </label>
          <label class="radio-label">
            <input type="radio" name="paymentMethod" value="credit" required> Crédito
          </label>
        </div>

        <label>¿Es en cuotas?</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="isInstallment" value="no" required> No
          </label>
          <label class="radio-label">
            <input type="radio" name="isInstallment" value="yes" required> Sí
          </label>
        </div>

        <label>¿Es suscripción fija?</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="isSubscription" value="no" required> No
          </label>
          <label class="radio-label">
            <input type="radio" name="isSubscription" value="yes" required> Sí
          </label>
        </div>
        <small id="subscription-hint" style="color:#6c5ce7;font-size:0.75rem;"></small>
        <div id="subscription-fields" style="display:none;">
          <label>Moneda</label>
          <select id="input-subscription-currency">
            <option value="ars">ARS (Peso Argentino)</option>
            <option value="usd">USD (Dólar)</option>
          </select>
          <label>Tasa de cambio (USD → ARS)</label>
          <input type="number" id="input-exchange-rate" placeholder="Ej: 1000" min="1" step="0.01">
        </div>

        <div id="installment-fields" style="display:none;">
          <label>Cantidad de cuotas</label>
          <input type="number" id="input-installments" placeholder="Ej: 9" min="1">

          <label>Monto de cada cuota</label>
          <input type="number" id="input-installment-amount" placeholder="Ej: 20000" min="0" step="0.01">

          <label>Mes de primer pago</label>
          <input type="month" id="input-start-month">
          <small id="installment-hint" style="color:#666;font-size:0.75rem;"></small>
        </div>

        <label>Fecha de compra</label>
        <input type="date" id="input-date" required>

        <button type="submit" class="btn-add">Agregar</button>
      </form>
    </section>

    <!-- HISTORY -->
    <section id="history" class="tab-content">
      <h2>Historial</h2>
      <div class="filters">
        <select id="filter-type">
          <option value="all">Todos</option>
          <option value="income">Ingresos</option>
          <option value="expense">Egresos</option>
        </select>
        <select id="filter-category">
          <option value="all">Todas las categorías</option>
          <option value="general">General</option>
          <option value="alimentacion">Alimentación</option>
          <option value="transporte">Transporte</option>
          <option value="entretenimiento">Entretenimiento</option>
          <option value="servicios">Servicios</option>
          <option value="salud">Salud</option>
          <option value="educacion">Educación</option>
          <option value="trabajo">Trabajo</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div id="history-list"></div>
    </section>

    <!-- PRÓXIMO MES -->
    <section id="nextmonth" class="tab-content">
      <h2>Guardar</h2>
      <div id="savings-form" style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:16px;margin-bottom:20px;">
        <label>Concepto</label>
        <input type="text" id="input-save-desc" placeholder="Ej: Fondo emergencia">
        <label>Monto</label>
        <input type="number" id="input-save-amount" placeholder="0" min="0" step="0.01">
        <label>Mes</label>
        <input type="month" id="input-save-month">
        <button class="btn-add" id="btn-add-save" style="margin-top:8px;">Agregar ahorro</button>
      </div>
      <h2>Resumen próximo mes</h2>
      <div id="nextmonth-list"></div>
      <div id="nextmonth-total" class="monthly-box"></div>
    </section>

    <!-- SUBSCRIPTIONS -->
    <section id="subscriptions" class="tab-content">
      <h2>Gastos fijos</h2>
      <div id="subscriptions-list"></div>
      <div id="subscriptions-total" class="monthly-box"></div>
    </section>

    <!-- INSTALLMENTS -->
    <section id="installments" class="tab-content">
      <h2>Cuotas pendientes</h2>
      <div id="installments-list"></div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script>
    // Capacitor Storage: si está en modo nativo usa Preferences, sino usa localStorage
    window.__storage = {
      get: async (key) => {
        if (window.Capacitor?.Plugins?.Preferences) {
          const r = await window.Capacitor.Plugins.Preferences.get({ key });
          return r.value ? JSON.parse(r.value) : null;
        }
        return JSON.parse(localStorage.getItem(key) || 'null');
      },
      set: async (key, value) => {
        const str = JSON.stringify(value);
        if (window.Capacitor?.Plugins?.Preferences) {
          await window.Capacitor.Plugins.Preferences.set({ key, value: str });
        } else {
          localStorage.setItem(key, str);
        }
      },
      remove: async (key) => {
        if (window.Capacitor?.Plugins?.Preferences) {
          await window.Capacitor.Plugins.Preferences.remove({ key });
        } else {
          localStorage.removeItem(key);
        }
      }
    };
  </script>
</body>
</html>
